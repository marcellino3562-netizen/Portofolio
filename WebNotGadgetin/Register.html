<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotGadgetin</title>
    <link rel="stylesheet" href="notGadgetin.css">
</head>

<body>
    <form action="Login.html">
        
        <div class="logo-wrapper">
            <img src="logoGweh.png" alt="NotGadgetin Logo" class="title-logo">
        </div>

        <div class="center-text">
            <span class="tagline">Login untuk menyimpan data anda</span>
        </div>

        <fieldset class="login-box">
            <legend>
                <h3>Register</h3>
            </legend>
            <table>
                <tr>
                    <td class="form-label">Username</td>
                    <td class="form-label">:</td>
                    <td><input type="text" name="nama"></td>
                </tr>
                <tr>
                    <td class="form-label">Password</td>
                    <td class="form-label">:</td>
                    <td><input type="password" name="password"></td>
                </tr>
                <tr>
                    <td class="form-label">Tanggal Lahir</td>
                    <td class="form-label">:</td>
                    <td><input type="date" name="TanggalLahir"></td>
                </tr>
                <tr>
                    <td class="form-label">Email</td>
                    <td class="form-label">:</td>
                    <td><input type="email" name="email"></td>
                </tr>
                <tr>
                    <td class="form-label">Alamat</td>
                    <td class="form-label">:</td>
                    <td><textarea name="alamat" cols="21" rows="1"></textarea></td>
                </tr>
                <tr>
                    <td class="form-label">Telepon</td>
                    <td class="form-label">:</td>
                    <td><input type="text" name="Telepon"></td>
                </tr>
                <tr>
                    <td class="form-label">Desil</td>
                    <td class="form-label">:</td>
                    <td>
                        <select name="Desil">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                    </td> 
                </tr>
                <tr>
                    <td class="form-label">Frekuensi Bermain</td>
                    <td class="form-label">:</td>
                    <td><input type="number" name="Nomor" min="1" max="5"></td>
                </tr>
                <tr>
                    <td class="form-label">Jenis Kelamin</td>
                    <td class="form-label">:</td>
                    <td class="form-label">
                        <input type="radio" name="jk" value="Laki-Laki"> Laki-Laki
                        <input type="radio" name="jk" value="Perempuan"> Perempuan
                    </td>
                </tr>
                <tr>
                    <td class="form-label">Upload KTP</td>
                    <td class="form-label">:</td>
                    <td><input type="file" name="KTP" style="color: white;"></td>
                </tr>
            </table>
            
            <button type="reset" class="btn-login">Reset</button>
            <button type="submit" class="btn-login">Register</button>
        </fieldset>
    </form>
</body>
</html>
