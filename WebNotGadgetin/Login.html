<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotGadgetin</title>
    <link rel="stylesheet" href="notGadgetin.css">
</head>
<body>
    <form action="index.html">
        
        <div class="logo-wrapper">
            <img src="logoGweh.png" alt="NotGadgetin Logo" class="title-logo">
        </div>

        <div class="center-text">
            <span class="tagline">Login untuk menyimpan data anda</span>
        </div>
        
        <fieldset class="login-box">
            <legend>
                <h3>Login</h3>
            </legend>
            <table>
                <tr>
                    <td class="form-label">Username</td>
                    <td class="form-label">:</td>
                    <td><input type="text" name="nama"></td>
                </tr>
                <tr>
                    <td class="form-label">Password</td>
                    <td class="form-label">:</td>
                    <td><input type="password" name="password"></td>
                </tr>
            </table>
            <button type="submit" class="btn-login">Login</button>
        </fieldset>
        
        <div class="register-link">
            <sub><a href="Register.html">Belum punya akun?, Register</a></sub>
        </div>
    </form>
</body>
</html>
